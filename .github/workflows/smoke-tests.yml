name: Cross-Platform Smoke Tests

# Called BEFORE publication by release.yml. Download and install the actual draft
# assets, rather than rebuilding a different snapshot. Manual rechecks are safe.
on:
  workflow_call:
    inputs:
      release_tag:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Exact existing release tag whose installers should be tested'
        required: true
        type: string

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ inputs.release_tag }}

jobs:
  test-macos:
    name: macOS DMG (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            arch: amd64
          - os: macos-15
            arch: arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download the actual DMG
        env:
          GH_TOKEN: ${{ github.token }}
          ARCH: ${{ matrix.arch }}
        run: gh release download "$RELEASE_TAG" --pattern "OriAgent-*-${ARCH}.dmg" --dir artifacts
      - name: Mount, copy and probe the installed application
        run: |
          set -euo pipefail
          mount="$RUNNER_TEMP/ori-dmg"
          app="$RUNNER_TEMP/OriAgent-smoke.app"
          mkdir -p "$mount"
          hdiutil attach artifacts/*.dmg -mountpoint "$mount" -nobrowse -quiet
          trap 'hdiutil detach "$mount" -quiet || true' EXIT
          test -x "$mount/OriAgent.app/Contents/MacOS/OriAgent"
          cp -R "$mount/OriAgent.app" "$app"
          hdiutil detach "$mount" -quiet
          trap - EXIT
          python3 scripts/smoke-installed.py "$app/Contents/Resources/ori-agent" "$RELEASE_TAG"

  test-linux-deb:
    name: Linux DEB (amd64)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Download the actual DEB
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "$RELEASE_TAG" --pattern '*_amd64.deb' --dir artifacts
      - name: Install and probe
        run: |
          set -euo pipefail
          sudo apt-get install -y ./artifacts/*.deb
          test -f /lib/systemd/system/ori-agent.service
          test -x /usr/bin/ori-folder-picker
          python3 scripts/smoke-installed.py /usr/bin/ori-agent "$RELEASE_TAG"

  test-linux-rpm:
    name: Linux RPM (amd64)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Download the actual RPM
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "$RELEASE_TAG" --pattern '*_amd64.rpm' --dir artifacts
      - name: Install and probe inside Fedora
        run: |
          docker run --rm \
            -v "$PWD/artifacts:/artifacts:ro" \
            -v "$PWD/scripts/smoke-installed.py:/smoke-installed.py:ro" \
            -e RELEASE_TAG fedora:43 bash -ec '
              dnf install -y python3 /artifacts/*.rpm
              test -f /lib/systemd/system/ori-agent.service
              test -x /usr/bin/ori-folder-picker
              python3 /smoke-installed.py /usr/bin/ori-agent "$RELEASE_TAG"
            '

  test-windows:
    name: Windows MSI (amd64)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download the actual MSI
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "$RELEASE_TAG" --pattern 'ori-agent-*-amd64.msi' --dir artifacts
      - name: Install and probe
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $packages = @(Get-ChildItem artifacts/*.msi)
          if ($packages.Count -ne 1) { throw 'Expected exactly one MSI' }
          $install = Start-Process msiexec.exe -ArgumentList "/i `"$($packages[0].FullName)`" /qn /norestart /l*v install.log" -Wait -PassThru
          if ($install.ExitCode -notin @(0, 3010)) {
            Get-Content install.log
            throw "MSI installation failed: $($install.ExitCode)"
          }
          $bin = 'C:\Program Files\OriAgent\bin\ori-agent.exe'
          if (-not (Test-Path $bin)) { throw 'Installed server is missing' }
          python scripts/smoke-installed.py $bin $env:RELEASE_TAG
          if ($LASTEXITCODE -ne 0) { throw 'Installed server probe failed' }

  summary:
    name: Installer gate
    runs-on: ubuntu-latest
    needs: [test-macos, test-linux-deb, test-linux-rpm, test-windows]
    if: always()
    steps:
      - name: Require every platform (failures and skipped jobs block publication)
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os
          results = json.loads(os.environ['RESULTS'])
          for name, result in results.items():
              print(f"{name}: {result['result']}")
          if not all(result['result'] == 'success' for result in results.values()):
              raise SystemExit('Installer gate failed; release stays a draft')
          PY
