name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

concurrency:
  group: release-build-${{ github.ref }}
  cancel-in-progress: false

env:
  GORELEASER_CURRENT_TAG: ${{ github.ref_name }}

jobs:
  verify:
    name: Verify release authorization
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      prerelease: ${{ steps.tag.outputs.prerelease }}
      previous_tag: ${{ steps.tag.outputs.previous_tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Require an RC or an explicit tested-RC promotion receipt
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          AUTO_RELEASE_HOLD: ${{ vars.AUTO_RELEASE_HOLD }}
          TAG: ${{ github.ref_name }}
        run: python3 scripts/release-candidate.py verify-build --tag "$TAG"

  # Main release job - builds Linux/Windows binaries and Linux packages
  release:
    name: Create Draft (Linux/Windows)
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.get_version.outputs.VERSION }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Get version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Run tests
        run: go test -v -short ./...

      - name: Install folder picker build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev build-essential pkg-config

      - name: Build folder picker app
        run: ./scripts/build-folder-picker.sh

      - name: Reset Wails-generated file changes
        run: git checkout -- cmd/folder-picker/frontend/wailsjs/runtime/ cmd/folder-picker/frontend/wailsjs/go/ go.mod go.sum 2>/dev/null || true

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_PREVIOUS_TAG: ${{ needs.verify.outputs.previous_tag }}

  # macOS DMG build job
  build-dmg:
    name: Build macOS DMG
    runs-on: macos-latest
    needs: release
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Build folder picker app
        run: ./scripts/build-folder-picker.sh

      - name: Reset Wails-generated file changes
        run: git checkout -- cmd/folder-picker/frontend/wailsjs/runtime/ cmd/folder-picker/frontend/wailsjs/go/ go.mod go.sum 2>/dev/null || true

      - name: Install GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: '~> v2'
          install-only: true

      - name: Build macOS binaries
        run: |
          # Build both server and menubar binaries in a single goreleaser run
          goreleaser build --clean --skip=before --id=server-macos --id=menubar

      - name: Create macOS DMG installers
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          SHORT_VERSION="${VERSION#v}"

          echo "Creating DMGs for version $SHORT_VERSION..."

          # Create DMG for Intel Macs
          ./build/macos/create-dmg.sh "$SHORT_VERSION" darwin amd64 dist || echo "Warning: amd64 DMG creation failed"

          # Eject any mounted DMG volumes and wait for resources to be released
          echo "Cleaning up before next DMG..."
          hdiutil info | grep -E "^/dev/" | awk '{print $1}' | while read dev; do
            hdiutil detach "$dev" -force 2>/dev/null || true
          done
          # diskimages-help can keep holding the previous DMG's resources for a
          # while after hdiutil create/detach return, which causes the next
          # hdiutil create to fail with "Resource busy". Wait for it to clear
          # instead of a fixed sleep (observed hanging past 3s on CI runners).
          for i in $(seq 1 30); do
            pgrep -x diskimages-help >/dev/null 2>&1 || break
            sleep 1
          done
          sleep 2

          # Create DMG for Apple Silicon
          ./build/macos/create-dmg.sh "$SHORT_VERSION" darwin arm64 dist || echo "Warning: arm64 DMG creation failed"

          # List created DMGs
          echo "Created DMGs:"
          ls -la dist/*.dmg 2>/dev/null || echo "No DMGs found"

      - name: Upload DMGs without publishing the draft
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release upload "$TAG" dist/*.dmg --clobber

      - name: Verify both DMG architectures were built
        run: |
          missing=0
          for arch in amd64 arm64; do
            if ! ls dist/*-${arch}.dmg >/dev/null 2>&1; then
              echo "::error::Missing ${arch} DMG in dist/ — it was not created or failed to build"
              missing=1
            fi
          done
          exit $missing

  # Windows MSI build job
  build-msi:
    name: Build Windows MSI
    runs-on: windows-latest
    needs: release  # Wait for release job to create the GitHub release
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Build folder picker app
        shell: bash
        run: ./scripts/build-folder-picker.sh

      - name: Install WiX Toolset
        shell: pwsh
        run: |
          choco install wixtoolset -y
          # Find and set WIX path dynamically (version may vary)
          $wixDir = Get-ChildItem "C:\Program Files (x86)" -Filter "WiX Toolset*" -Directory | Select-Object -First 1
          if ($wixDir) {
            $wixBin = Join-Path $wixDir.FullName "bin"
            Write-Host "Found WiX at: $wixBin"
            echo $wixBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
            echo "WIX=$($wixDir.FullName)\" >> $env:GITHUB_ENV
          } else {
            Write-Host "WiX Toolset not found in Program Files (x86)"
            exit 1
          }

      - name: Build Windows binaries
        env:
          RELEASE_VERSION: ${{ needs.release.outputs.version }}
        run: |
          $version = $env:RELEASE_VERSION
          $env:CGO_ENABLED = "0"

          # Create dist structure expected by create-msi.ps1
          New-Item -ItemType Directory -Path "dist\server_windows_amd64" -Force

          # Build with version information
          go build -ldflags="-s -w -X 'github.com/johnjallday/ori-agent/internal/version.Version=$version'" -o dist\server_windows_amd64\ori-agent.exe .\cmd\server

      - name: Create MSI installer
        env:
          RELEASE_VERSION: ${{ needs.release.outputs.version }}
        run: |
          $version = $env:RELEASE_VERSION.TrimStart('v')
          .\build\windows\create-msi.ps1 -Version $version -Arch amd64 -DistDir dist

      - name: Upload MSI without publishing the draft
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release upload "$TAG" dist/ori-agent-*.msi --clobber

  smoke:
    name: Verify actual release installers
    needs: [release, build-dmg, build-msi]
    uses: ./.github/workflows/smoke-tests.yml
    with:
      release_tag: ${{ github.ref_name }}
    permissions:
      contents: read

  publish:
    name: Publish verified release
    needs: [verify, smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Attach the exact RC's manual test report before publishing
        if: needs.verify.outputs.prerelease == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          PREVIOUS_TAG: ${{ needs.verify.outputs.previous_tag }}
          REPOSITORY: ${{ github.repository }}
          AUTO_RELEASE_HOLD: ${{ vars.AUTO_RELEASE_HOLD }}
        run: python3 scripts/release-candidate.py attach-test-report --rc "$TAG" --previous "$PREVIOUS_TAG" --repository "$REPOSITORY"
      - name: Publish only after every installer check succeeds
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
          AUTO_RELEASE_HOLD: ${{ vars.AUTO_RELEASE_HOLD }}
        run: |
          case "${AUTO_RELEASE_HOLD,,}" in
            1|true|yes|on) echo 'Release held before publication'; exit 1 ;;
          esac
          latest=false
          if [ "$PRERELEASE" = false ]; then latest=true; fi
          gh release edit "$TAG" --draft=false --prerelease="$PRERELEASE" --latest="$latest"
          echo "Published $TAG (prerelease: $PRERELEASE); installer checks passed." >> "$GITHUB_STEP_SUMMARY"
          if [ "$PRERELEASE" = true ]; then
            echo "Download rc-test-report-$TAG.md from the prerelease, complete it using docs/RC_TEST_PROTOCOL.md, then request promotion of this exact RC." >> "$GITHUB_STEP_SUMMARY"
          fi

  sync-dev:
    name: Open release merge-back PR
    needs: [verify, publish]
    if: needs.verify.outputs.prerelease == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Preserve stabilization fixes and release ancestry on dev
        env:
          # PAT-created PRs trigger CI; GITHUB_TOKEN-created PRs do not.
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
          VERSION: ${{ github.ref_name }}
        run: python3 scripts/release-candidate.py sync-pr --version "$VERSION"
