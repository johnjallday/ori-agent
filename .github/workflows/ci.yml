name: CI

on:
  push:
    branches: [ main, dev, develop, 'release/**' ]
  pull_request:
    branches: [ main, dev, develop, 'epic/**' ]

# Cancel an in-flight run when the same ref is pushed again. Without this, a
# quick follow-up push left the previous full matrix running to completion: 59
# runs in one 30-day window were already obsolete before they finished. Minutes
# are free on a public repo, so this buys wall-clock time and runner slots, not
# money - macOS runners in particular are a scarce pool and obsolete jobs sit in
# front of the ones you actually care about.
#
# main/dev are excluded from cancellation because auto-release.yml reads the CI
# conclusion on dev to decide whether the tree is releasable - a cancelled run
# there would read as "not green" and silently stall the release gate.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/dev' && github.ref != 'refs/heads/main' }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          # Full history so --new-from-merge-base can resolve origin/dev
          # locally. The alternative, golangci-lint-action's only-new-issues,
          # depends on the GitHub PR-diff API for pull_request events, which
          # has a size ceiling this repo's larger PRs (e.g. a mechanical
          # Prettier-baseline commit touching ~200 files) can exceed - when
          # that happens the action silently reports the full, unfiltered
          # backlog instead of just what the PR changed.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25.12'
          cache: true

      - name: Run go fmt
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "Go code is not formatted:"
            gofmt -d .
            exit 1
          fi

      - name: Run go vet
        run: go vet ./...

      - name: Check generated Wails binding file modes
        run: make check-wails-modes

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version-file: .golangci-lint-version
          args: --new-from-merge-base=origin/dev

  frontend-lint:
    name: Frontend Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: 'npm'

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend format check
        run: npm run format:check

      - name: Run frontend lint
        run: npm run lint

      - name: Run frontend module tests
        run: npm run test:modules

      # Rasterizes the 27 character SVGs and proves they stay transparent and
      # map-ready. Deterministic and offline: sharp is already a devDependency,
      # and one process checks every asset.
      - name: Run character asset contract
        run: npm run test:character-assets

  readme-contract:
    name: README Contract
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      README_CAPTURE_CI_RUN_ID: ci-readme-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25.12'
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: 'npm'

      - name: Install pinned frontend dependencies
        run: npm ci

      - name: Install Chromium for disposable README capture
        run: npx playwright install --with-deps chromium

      - name: Run README Node tests
        run: npm run readme:test

      - name: Validate README manifest and accepted assets
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$(node -p 'require("./docs/readme-screenshots.json").acceptance_state')" == "bootstrap" ]]; then
            # The initial feature PR is allowed to contain only the known migration gaps.
            # Any other contract error remains a CI failure.
            set +e
            node scripts/readme/manifest.mjs --json > "$RUNNER_TEMP/readme-contract-bootstrap.json"
            manifest_status=$?
            set -e
            [[ "$manifest_status" -eq 1 ]]
            jq -e '
              .manifest.acceptance_state == "bootstrap"
              and (.errors | length == 12)
              and all(.errors[]; .code == "readme.unmanifested_product_image" or .code == "readme.missing_manifest_image" or .code == "image.missing_output")
            ' "$RUNNER_TEMP/readme-contract-bootstrap.json" >/dev/null
            echo "README contract is in the expected initial bootstrap state; accepted assets are not published by CI."
          else
            make readme-check
          fi

      - name: Capture and compare disposable README screenshots
        id: readme_capture
        shell: bash
        run: |
          set -euo pipefail
          run_dir="test-results/readme-refresh/${README_CAPTURE_CI_RUN_ID}"
          if ! bash scripts/readme-refresh.sh capture --run-id "$README_CAPTURE_CI_RUN_ID"; then
            echo "::error::Disposable README capture failed; the command output above includes the failed scene or rule and safe retry command."
            find "$run_dir/logs" -maxdepth 1 -type f -print -exec tail -n 40 {} \; 2>/dev/null || true
            exit 1
          fi
          test -f "$run_dir/comparison/README_CAPTURE_REPORT.md"
          git diff --exit-code -- README.md docs/images docs/readme-screenshots.json

      # A same-environment mismatch is a pixel-level failure. Preserve only the
      # fictional scene pairs, encoder metadata, and logs long enough to inspect
      # the differing Linux frames; successful runs still upload nothing.
      - name: Upload failed README capture evidence
        if: failure() && steps.readme_capture.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: readme-capture-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            test-results/readme-refresh/${{ env.README_CAPTURE_CI_RUN_ID }}/raw/*.png
            test-results/readme-refresh/${{ env.README_CAPTURE_CI_RUN_ID }}/raw-repeat/*.png
            test-results/readme-refresh/${{ env.README_CAPTURE_CI_RUN_ID }}/proposed/*.webp
            test-results/readme-refresh/${{ env.README_CAPTURE_CI_RUN_ID }}/proposed/image-metadata.json
            test-results/readme-refresh/${{ env.README_CAPTURE_CI_RUN_ID }}/proposed-repeat/*.webp
            test-results/readme-refresh/${{ env.README_CAPTURE_CI_RUN_ID }}/proposed-repeat/image-metadata.json
            test-results/readme-refresh/${{ env.README_CAPTURE_CI_RUN_ID }}/logs/
          if-no-files-found: warn
          retention-days: 7

      - name: Clean up disposable README capture
        if: always()
        shell: bash
        run: |
          run_dir="test-results/readme-refresh/${README_CAPTURE_CI_RUN_ID}"
          if [[ -d "$run_dir" ]]; then
            bash scripts/readme-refresh.sh cleanup --run-id "$README_CAPTURE_CI_RUN_ID"
          fi

  test-unit:
    name: Unit Tests
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        go-version: ['1.25.12']

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      - name: Download dependencies
        run: go mod download

      # The macOS leg exists to cover darwin-specific code, not to re-run what
      # the ubuntu leg just ran. Measured over 34 runs (2026-08-05..07) it spent
      # ~8.5 min on the identical 150 packages at 10x the per-minute rate: 88%
      # of every macOS minute this repo burns, for zero extra signal. Scoping it
      # to the packages whose behaviour can differ by GOOS takes that to ~22s of
      # test time while still compiling every darwin-tagged file - which nothing
      # else in CI does, since `make build` only builds ./cmd/server.
      #
      # The scope is chosen inside the step on purpose. Adding a matrix key
      # would rename the job, and `Unit Tests (macos-latest, 1.25.12)` is a
      # required check on dev: a renamed job leaves the old context pending
      # forever and wedges every PR.
      - name: Run unit tests
        shell: bash
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = "macOS" ]; then
            packages=$(./scripts/list-unit-packages.sh --platform)
            {
              echo "### Darwin-scoped unit run"
              echo
              echo "This leg ran only the platform-conditional packages. Full-suite"
              echo "coverage comes from \`Unit Tests (ubuntu-latest, 1.25.12)\`."
              echo
              echo '```'
              echo "$packages"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            packages=$(./scripts/list-unit-packages.sh)
          fi
          # -timeout: internal/sessionhttp opens a fresh in-memory database per
          # test and runs every migration against it, ~208 times. Under -race on
          # the Linux runner that package alone sat at 574s of Go's default 600s
          # per-package budget before this flag existed, so an ordinary PR adding
          # a handful of tests to it failed as a timeout rather than on its own
          # merits. The headroom buys back that margin; the standing fix is to
          # migrate once and reuse the schema across tests, tracked separately.
          go test -v -short -race -timeout 20m -coverprofile=coverage.txt -covermode=atomic $packages

      # Linux only: the macOS profile now covers a 15-package subset, and
      # uploading it under the same flag would report the difference as a
      # coverage drop rather than as the deliberate scope it is.
      - name: Upload coverage to Codecov
        if: runner.os == 'Linux'
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.txt
          flags: unittests
          name: codecov-${{ matrix.os }}
        continue-on-error: true

  test-integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: test-unit

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25.12'
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Run integration tests
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "$OPENAI_API_KEY" ] || [ -n "$ANTHROPIC_API_KEY" ]; then
            ORI_RUN_PROVIDER_INTEGRATION=1 go test -v -run Integration ./...
          else
            echo "Skipping integration tests (no API keys configured)"
          fi

  test-e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: test-unit

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25.12'
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Build server
        run: make build

      - name: Run E2E tests
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "$OPENAI_API_KEY" ] || [ -n "$ANTHROPIC_API_KEY" ]; then
            ORI_RUN_PROVIDER_INTEGRATION=1 go test -v ./tests/e2e/...
          else
            echo "Skipping E2E tests (no API keys configured)"
          fi

  build:
    name: Build
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go-version: ['1.25.12']

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Build server (Unix)
        if: runner.os != 'Windows'
        run: make build

      - name: Build server (Windows)
        if: runner.os == 'Windows'
        run: go build -o bin/ori-agent.exe ./cmd/server

      # No upload-artifact here on purpose. This job exists to prove the tree
      # still compiles on all three platforms; the binaries it produces are
      # throwaway. Uploading them stored ~110 MB per run (3 OSes x ~37 MB) that
      # nothing consumed - there is no download-artifact step anywhere in this
      # repo and no workflow depends on them. Storage is free on a public repo,
      # so this is not a cost fix; it just drops ~110 MB of pointless upload
      # time from every run. Real distributables come from GoReleaser in
      # release.yml on tags - grab those from the release page instead.

  security:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25.12'

      - name: Run Gosec Security Scanner
        uses: securego/gosec@master
        with:
          args: '-no-fail -fmt sarif -out results.sarif ./...'
        continue-on-error: true

      - name: Upload SARIF file
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results.sarif
        continue-on-error: true

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        continue-on-error: true
