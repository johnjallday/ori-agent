name: CI

on:
  push:
    branches: [ main, dev, develop, 'release/**' ]
  pull_request:
    branches: [ main, dev, develop, 'epic/**' ]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25.12'
          cache: true

      - name: Run go fmt
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "Go code is not formatted:"
            gofmt -d .
            exit 1
          fi

      - name: Run go vet
        run: go vet ./...

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.62.2
        continue-on-error: true  # Don't fail build on linter warnings initially

  frontend-lint:
    name: Frontend Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: 'npm'

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend lint
        run: npm run lint

      - name: Run frontend module tests
        run: npm run test:modules

  readme-contract:
    name: README Contract
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25.12'
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: 'npm'

      - name: Install pinned frontend dependencies
        run: npm ci

      - name: Install Chromium for disposable README capture
        run: npx playwright install --with-deps chromium

      - name: Run README Node tests
        run: npm run readme:test

      - name: Validate README manifest and accepted assets
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$(node -p 'require("./docs/readme-screenshots.json").acceptance_state')" == "bootstrap" ]]; then
            # The initial feature PR is allowed to contain only the known migration gaps.
            # Any other contract error remains a CI failure.
            set +e
            node scripts/readme/manifest.mjs --json > "$RUNNER_TEMP/readme-contract-bootstrap.json"
            manifest_status=$?
            set -e
            [[ "$manifest_status" -eq 1 ]]
            jq -e '
              .manifest.acceptance_state == "bootstrap"
              and (.errors | length == 12)
              and all(.errors[]; .code == "readme.unmanifested_product_image" or .code == "readme.missing_manifest_image" or .code == "image.missing_output")
            ' "$RUNNER_TEMP/readme-contract-bootstrap.json" >/dev/null
            echo "README contract is in the expected initial bootstrap state; accepted assets are not published by CI."
          else
            make readme-check
          fi

      - name: Capture and compare disposable README screenshots
        shell: bash
        run: |
          set -euo pipefail
          run_id="ci-readme-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          run_dir="test-results/readme-refresh/${run_id}"
          cleanup() {
            bash scripts/readme-refresh.sh cleanup --run-id "$run_id" || true
          }
          trap cleanup EXIT
          if ! bash scripts/readme-refresh.sh capture --run-id "$run_id"; then
            echo "::error::Disposable README capture failed; the command output above includes the failed scene or rule and safe retry command."
            find "$run_dir/logs" -maxdepth 1 -type f -print -exec tail -n 40 {} \; 2>/dev/null || true
            exit 1
          fi
          test -f "$run_dir/comparison/README_CAPTURE_REPORT.md"
          git diff --exit-code -- README.md docs/images docs/readme-screenshots.json

  test-unit:
    name: Unit Tests
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        go-version: ['1.25.12']

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Run unit tests
        run: go test -v -short -race -coverprofile=coverage.txt -covermode=atomic ./...

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.txt
          flags: unittests
          name: codecov-${{ matrix.os }}
        continue-on-error: true

  test-integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: test-unit

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25.12'
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Run integration tests
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "$OPENAI_API_KEY" ] || [ -n "$ANTHROPIC_API_KEY" ]; then
            go test -v -run Integration ./...
          else
            echo "Skipping integration tests (no API keys configured)"
          fi

  test-e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: test-unit

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25.12'
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Build server
        run: make build

      - name: Run E2E tests
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "$OPENAI_API_KEY" ] || [ -n "$ANTHROPIC_API_KEY" ]; then
            go test -v ./tests/e2e/...
          else
            echo "Skipping E2E tests (no API keys configured)"
          fi

  build:
    name: Build
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go-version: ['1.25.12']

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Build server (Unix)
        if: runner.os != 'Windows'
        run: make build

      - name: Build server (Windows)
        if: runner.os == 'Windows'
        run: go build -o bin/ori-agent.exe ./cmd/server

      - name: Upload build artifacts
        uses: actions/upload-artifact@v5
        with:
          name: ori-agent-${{ matrix.os }}
          path: bin/
          retention-days: 7

  security:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25.12'

      - name: Run Gosec Security Scanner
        uses: securego/gosec@master
        with:
          args: '-no-fail -fmt sarif -out results.sarif ./...'
        continue-on-error: true

      - name: Upload SARIF file
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results.sarif
        continue-on-error: true

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        continue-on-error: true
