name: Promote Release
run-name: Promote ${{ inputs.rc_tag }} to stable

# No schedule and no workflow_run trigger here. The dispatch comes from a person,
# or from auto-release.yml's react job once an RC has green branch CI, a published
# prerelease and passing installer checks. Approving the `release` environment
# review below is the human action that publishes stable.
on:
  workflow_dispatch:
    inputs:
      rc_tag:
        description: 'Exact candidate to promote, e.g. v0.0.112-rc.2'
        required: true
        type: string
      confirm_tested:
        description: 'Automated checks are green for this exact RC (branch CI, published prerelease, installers). By approving the release environment review you confirm you completed and reviewed the test report for this exact RC and approve stable release'
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: release-lifecycle
  cancel-in-progress: false

jobs:
  validate:
    name: Validate tested candidate
    if: github.ref == 'refs/heads/main' && inputs.confirm_tested
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.candidate.outputs.sha }}
      version: ${{ steps.candidate.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Verify exact RC, branch CI and installer workflow
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
          AUTO_RELEASE_HOLD: ${{ vars.AUTO_RELEASE_HOLD }}
          RC_TAG: ${{ inputs.rc_tag }}
        run: python3 scripts/release-candidate.py check-promotion --rc "$RC_TAG"

  promote:
    name: Approve ${{ inputs.rc_tag }} → ${{ needs.validate.outputs.version }}
    needs: validate
    runs-on: ubuntu-latest
    # Configure required reviewers: when auto-release.yml dispatched this run,
    # their approval is the only human step between a green RC and stable.
    environment: release
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PAT }}
      - name: Revalidate after approval and atomically promote the pinned SHA
        env:
          GH_TOKEN: ${{ github.token }}
          AUTO_RELEASE_HOLD: ${{ vars.AUTO_RELEASE_HOLD }}
          RC_TAG: ${{ inputs.rc_tag }}
          SHA: ${{ needs.validate.outputs.sha }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python3 scripts/release-candidate.py promote --rc "$RC_TAG" --sha "$SHA"
