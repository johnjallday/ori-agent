name: Auto Release

# Cadence prepares an RC, NEVER stable. One active release branch at a time;
# feature PRs continue to dev while that branch is tested. See docs/RELEASE_CHECKLIST.md.
# RELEASE_PAT must be able to push release branches/tags, merge PRs and trigger workflows.
#
# Finished CI and Release runs land here too (workflow_run fires for main's copy
# of this file only). The react job re-cuts a candidate whose branch turned
# green, lands the release watcher's dev→release sync PR once dev CI is green
# for that exact commit, lands a shipped release's merge-back PR into dev with a
# merge commit once that PR's own CI run is green, and requests promotion once
# an RC has every automated check green. A merge-back that was squashed anyway
# is repaired by the scheduled run: the repair job opens a zero-diff merge-commit
# PR that lands itself. Holds only a person can clear turn the scheduled run red.
# Publishing stable still needs a person to approve the `release` environment
# review on the dispatched Promote Release run.
on:
  schedule:
    - cron: '30 18 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Prepare an RC below 10 PRs (green CI is still required)'
        type: boolean
        default: false
      candidate:
        description: 'Existing release version to rebuild after fixes, e.g. v0.0.112 (blank = new batch)'
        type: string
        default: ''
  workflow_run:
    workflows: [CI, Release]
    types: [completed]

permissions:
  contents: read

# The lifecycle lock is per job and shared with promotion: no overlapping
# lifecycle mutations, and dev is never locked. It must not sit at workflow
# level: every finished PR CI run creates a workflow_run fire here, and a fire
# whose only job is skipped would still enter a workflow-level group and cancel
# the scheduled evaluation queued behind a promotion waiting for approval.
jobs:
  # A merge shortly before the evaluation leaves ci.yml running for the exact
  # commit, and evaluate would HOLD until the next day. This job only waits
  # (up to RELEASE_CI_WAIT_SECONDS) and decides nothing. It holds no lifecycle
  # lock, so the react and promotion jobs are never queued behind it.
  await-ci:
    name: Wait for CI on the candidate commit
    if: github.ref == 'refs/heads/main' && github.event_name != 'workflow_run'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Wait for ci.yml
        env:
          GH_TOKEN: ${{ github.token }}
          AUTO_RELEASE_HOLD: ${{ vars.AUTO_RELEASE_HOLD }}
          CANDIDATE: ${{ inputs.candidate }}
        run: python3 scripts/release-candidate.py await-ci --candidate "$CANDIDATE"

  evaluate:
    name: Evaluate candidate readiness
    needs: await-ci
    # Evaluate even when the wait failed for an infrastructure reason: it is the
    # gate, and it re-reads CI itself.
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && github.event_name != 'workflow_run' }}
    runs-on: ubuntu-24.04
    concurrency:
      group: release-lifecycle
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
    outputs:
      ready: ${{ steps.gate.outputs.ready }}
      version: ${{ steps.gate.outputs.version }}
      sha: ${{ steps.gate.outputs.sha }}
      repair: ${{ steps.gate.outputs.repair }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Evaluate only
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          AUTO_RELEASE_HOLD: ${{ vars.AUTO_RELEASE_HOLD }}
          FORCE_RELEASE: ${{ inputs.force }}
          CANDIDATE: ${{ inputs.candidate }}
        run: python3 scripts/release-candidate.py evaluate --candidate "$CANDIDATE"

  candidate:
    name: Prepare RC for ${{ needs.evaluate.outputs.version }}
    needs: evaluate
    if: needs.evaluate.outputs.ready == 'true'
    runs-on: ubuntu-24.04
    concurrency:
      group: release-lifecycle
      cancel-in-progress: false
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PAT }}
      - name: Freeze branch and tag candidate
        env:
          GH_TOKEN: ${{ github.token }}
          AUTO_RELEASE_HOLD: ${{ vars.AUTO_RELEASE_HOLD }}
          VERSION: ${{ needs.evaluate.outputs.version }}
          SHA: ${{ needs.evaluate.outputs.sha }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python3 scripts/release-candidate.py prepare --version "$VERSION" --sha "$SHA"

  # The last stable's merge-back was squashed: dev has its content but not its
  # ancestry, and the gate cannot count the next batch. This opens a zero-diff
  # merge-commit PR from release-merge-back/<version> and arms auto-merge. It
  # needs the PAT: a PR from GITHUB_TOKEN gets no CI run and would never land.
  repair:
    name: Restore ${{ needs.evaluate.outputs.repair }} release ancestry on dev
    needs: evaluate
    if: needs.evaluate.outputs.repair != ''
    runs-on: ubuntu-24.04
    concurrency:
      group: release-lifecycle
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PAT }}
      - name: Open a zero-diff merge-commit PR that lands itself
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
          AUTO_RELEASE_HOLD: ${{ vars.AUTO_RELEASE_HOLD }}
          VERSION: ${{ needs.evaluate.outputs.repair }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python3 scripts/release-candidate.py repair --version "$VERSION"

  react:
    name: React to ${{ github.event.workflow_run.name }} on ${{ github.event.workflow_run.head_branch }}
    # Successful runs only; failures belong to the release watcher routine. Push
    # runs on dev, a release branch or an RC tag drive the lifecycle. The one
    # pull_request run that authorizes a step is a shipped release's merge-back
    # into dev, from its release branch or from the repair branch of a squashed
    # one: react lands that PR with a merge commit once its CI run is green.
    if: >-
      github.event_name == 'workflow_run'
      && github.ref == 'refs/heads/main'
      && github.event.workflow_run.conclusion == 'success'
      && ((github.event.workflow_run.event == 'push'
           && (github.event.workflow_run.head_branch == 'dev'
               || startsWith(github.event.workflow_run.head_branch, 'release/')
               || contains(github.event.workflow_run.head_branch, '-rc.')))
          || (github.event.workflow_run.event == 'pull_request'
              && github.event.workflow_run.head_repository.full_name == github.repository
              && (startsWith(github.event.workflow_run.head_branch, 'release/')
                  || startsWith(github.event.workflow_run.head_branch, 'release-merge-back/'))))
    runs-on: ubuntu-24.04
    concurrency:
      group: release-lifecycle
      cancel-in-progress: false
    permissions:
      contents: write
      actions: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PAT }}
      - name: Re-cut, land a sync PR or request promotion
        env:
          # The PAT's tag pushes, merges and dispatches trigger CI/Release; GITHUB_TOKEN's would not.
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
          AUTO_RELEASE_HOLD: ${{ vars.AUTO_RELEASE_HOLD }}
          WORKFLOW: ${{ github.event.workflow_run.name }}
          EVENT: ${{ github.event.workflow_run.event }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python3 scripts/release-candidate.py react --workflow "$WORKFLOW" --event "$EVENT" \
            --branch "$BRANCH" --sha "$SHA" --conclusion "$CONCLUSION"
