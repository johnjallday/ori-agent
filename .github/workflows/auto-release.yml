name: Auto Release

# Cadence prepares an RC, NEVER stable. One active release branch at a time;
# feature PRs continue to dev while that branch is tested. See docs/RELEASE_CHECKLIST.md.
# RELEASE_PAT must be able to push release branches/tags and trigger workflows.
on:
  schedule:
    - cron: '30 18 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Prepare an RC below 10 PRs (green CI is still required)'
        type: boolean
        default: false
      candidate:
        description: 'Existing release version to rebuild after fixes, e.g. v0.0.112 (blank = new batch)'
        type: string
        default: ''

permissions:
  contents: read

# Shared with promotion: no overlapping lifecycle mutations. Does not lock dev.
concurrency:
  group: release-lifecycle
  cancel-in-progress: false

jobs:
  evaluate:
    name: Evaluate candidate readiness
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      ready: ${{ steps.gate.outputs.ready }}
      version: ${{ steps.gate.outputs.version }}
      sha: ${{ steps.gate.outputs.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Evaluate only
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          AUTO_RELEASE_HOLD: ${{ vars.AUTO_RELEASE_HOLD }}
          FORCE_RELEASE: ${{ inputs.force }}
          CANDIDATE: ${{ inputs.candidate }}
        run: python3 scripts/release-candidate.py evaluate --candidate "$CANDIDATE"

  candidate:
    name: Prepare RC for ${{ needs.evaluate.outputs.version }}
    needs: evaluate
    if: needs.evaluate.outputs.ready == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PAT }}
      - name: Freeze branch and tag candidate
        env:
          GH_TOKEN: ${{ github.token }}
          AUTO_RELEASE_HOLD: ${{ vars.AUTO_RELEASE_HOLD }}
          VERSION: ${{ needs.evaluate.outputs.version }}
          SHA: ${{ needs.evaluate.outputs.sha }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python3 scripts/release-candidate.py prepare --version "$VERSION" --sha "$SHA"
