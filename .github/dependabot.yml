version: 2
updates:
  # Go modules dependency updates
  - package-ecosystem: "gomod"
    directory: "/"
    # Target dev so dep bumps flow through the normal dev -> main release
    # merge instead of landing directly on main and diverging the branches.
    target-branch: "dev"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 10
    reviewers:
      - "johnjallday"
    labels:
      - "dependencies"
      - "go"
    commit-message:
      prefix: "deps"
      include: "scope"
    # Group minor and patch updates together
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    # Allow both direct and indirect dependencies
    allow:
      - dependency-type: "direct"
      - dependency-type: "indirect"
    ignore:
      # invopop/jsonschema v0.14 switched ordered-map to pb33f, while
      # anthropic-sdk-go (<= v1.43) still uses wk8/go-ordered-map and
      # fails to build against jsonschema 0.14+. Hold at 0.13.x until
      # the SDK ships its pb33f fix:
      #   https://github.com/anthropics/anthropic-sdk-go/issues/325
      #   https://github.com/anthropics/anthropic-sdk-go/pull/326
      # Remove this entry once a fixed SDK release is available so the
      # two can bump together.
      - dependency-name: "github.com/invopop/jsonschema"
        versions: [">= 0.14"]
