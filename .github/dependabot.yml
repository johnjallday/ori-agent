version: 2
updates:
  # Go modules dependency updates
  - package-ecosystem: "gomod"
    directory: "/"
    # Target dev so dep bumps flow through the normal dev -> main release
    # merge instead of landing directly on main and diverging the branches.
    target-branch: "dev"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 10
    reviewers:
      - "johnjallday"
    labels:
      - "dependencies"
      - "go"
    commit-message:
      prefix: "deps"
      include: "scope"
    # Group minor and patch updates together
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    # Allow both direct and indirect dependencies
    allow:
      - dependency-type: "direct"
      - dependency-type: "indirect"
    # Ignore specific dependencies if needed
    ignore:
      # v1.60.x is the prime suspect for the v0.0.119-rc.1 macOS DMG build
      # hang (goreleaser 1h timeout). Remove once the cause is confirmed.
      - dependency-name: "modernc.org/sqlite"
        update-types: ["version-update:semver-minor"]
