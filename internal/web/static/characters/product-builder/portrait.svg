<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160" role="img" aria-label="Product Builder: a compact resident with broad hands and planted feet wearing a tool belt">
  <!-- Product Builder. Hand-authored; see docs/CHARACTER_ASSET_PROVENANCE.md#product-builder -->
  <defs><clipPath id="rivet-frame"><rect width="160" height="160" rx="16"/></clipPath></defs>
  <g clip-path="url(#rivet-frame)">
    <rect width="160" height="160" fill="#e2ead4"/>
    <circle cx="80" cy="74" r="54" fill="#f0f5e6"/>
    <rect x="0" y="144" width="160" height="16" fill="#c6d3b2"/>

    <g stroke="#12200a" stroke-width="4" stroke-linejoin="round" stroke-linecap="round">
      <!-- planted feet, set wide -->
      <rect x="46" y="128" width="26" height="18" rx="4" fill="#3f5a20"/>
      <rect x="88" y="128" width="26" height="18" rx="4" fill="#3f5a20"/>

      <!-- flat tail behind -->
      <path d="M108 118 q26 4 26 -14 q0 -14 -18 -12" fill="#658c36"/>

      <!-- compact body -->
      <rect x="50" y="76" width="60" height="56" rx="16" fill="#f5f2e0"/>

      <!-- tool belt -->
      <rect x="46" y="102" width="68" height="14" rx="4" fill="#658c36"/>
      <rect x="56" y="104" width="8" height="10" rx="2" fill="#3f5a20"/>
      <rect x="76" y="104" width="8" height="10" rx="2" fill="#3f5a20"/>
      <rect x="96" y="104" width="8" height="10" rx="2" fill="#3f5a20"/>

      <!-- broad hands -->
      <circle cx="42" cy="94" r="12" fill="#f5f2e0"/>
      <circle cx="118" cy="94" r="12" fill="#f5f2e0"/>

      <!-- head -->
      <rect x="56" y="34" width="48" height="42" rx="14" fill="#f5f2e0"/>
      <!-- ears -->
      <circle cx="56" cy="42" r="8" fill="#f5f2e0"/>
      <circle cx="104" cy="42" r="8" fill="#f5f2e0"/>
    </g>

    <circle cx="70" cy="54" r="4.5" fill="#12200a"/>
    <circle cx="90" cy="54" r="4.5" fill="#12200a"/>
    <circle cx="71.5" cy="52.5" r="1.6" fill="#f5f2e0"/>
    <circle cx="91.5" cy="52.5" r="1.6" fill="#f5f2e0"/>
    <!-- two front teeth: the builder's tell -->
    <rect x="74" y="64" width="12" height="8" rx="2" fill="#fdfdf5" stroke="#12200a" stroke-width="2.5"/>
    <path d="M80 64 v8" stroke="#12200a" stroke-width="2"/>
  </g>
</svg>
