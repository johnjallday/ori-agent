<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" role="img" aria-label="Decision Strategist">
  <!-- Decision Strategist idle: unrolls a map corner, then a tail-tip flick. Decorative only (FR-72).
       Transparent artboard. The disc was cropping the ear tips (y=-2), the cape
       hem, and the tail, which reached x=46 before the flick even started. All
       three are refitted inside the 2-unit safe perimeter with the flick's
       -11deg and +5deg extremes accounted for; the flick itself is unchanged. -->
  <style>
    .nox-tail { transform-origin: 32px 38px; animation: nox-flick 3.6s ease-in-out infinite; }
    @keyframes nox-flick { 0%,64%,100% { transform: rotate(0deg); } 76% { transform: rotate(-11deg); } 88% { transform: rotate(5deg); } }
    @media (prefers-reduced-motion: reduce) { .nox-tail { animation: none; } }
  </style>
  <g stroke="#170e19" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round">
    <path class="nox-tail" d="M32 38 q9 -1 7 -10" fill="none" stroke-width="5.6"/>
    <path class="nox-tail" d="M32 38 q9 -1 7 -10" fill="none" stroke="#6c4b74" stroke-width="3"/>
    <!-- body; its base is the y=43 ground line -->
    <path d="M14 43 q0-15 10-15 q10 0 10 15 z" fill="#f6f1f7"/>
    <path d="M13 30 q11 -6 22 1 l-2 10 q-8 2 -16 0 z" fill="#6c4b74"/>
    <circle cx="24" cy="20" r="10" fill="#f6f1f7"/>
    <path d="M16 12 l-2 -7 l10 5 z" fill="#f6f1f7"/>
    <path d="M32 12 l2 -7 l-10 5 z" fill="#f6f1f7"/>
  </g>
  <path d="M18 19 q2.5 -3 5 0" fill="none" stroke="#170e19" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M26 19 q2.5 -3 5 0" fill="none" stroke="#170e19" stroke-width="2.4" stroke-linecap="round"/>
</svg>
