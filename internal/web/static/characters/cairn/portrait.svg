<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160" role="img" aria-label="Cairn, a stack of rounded stones with a bright core and utility pouches">
  <!-- Cairn — Operations Keeper. Hand-authored; see docs/CHARACTER_ASSET_PROVENANCE.md#cairn -->
  <defs><clipPath id="cairn-frame"><rect width="160" height="160" rx="16"/></clipPath></defs>
  <g clip-path="url(#cairn-frame)">
    <rect width="160" height="160" fill="#d6e5e3"/>
    <circle cx="80" cy="74" r="54" fill="#e8f1f0"/>
    <rect x="0" y="144" width="160" height="16" fill="#b3c9c6"/>

    <g stroke="#07211f" stroke-width="4" stroke-linejoin="round" stroke-linecap="round">
      <!-- base stone -->
      <rect x="40" y="108" width="80" height="38" rx="16" fill="#9db4b2"/>
      <!-- middle stone, carrying the core -->
      <rect x="48" y="66" width="64" height="46" rx="18" fill="#b6c9c7"/>
      <!-- crown stone -->
      <rect x="58" y="28" width="44" height="42" rx="17" fill="#c9d9d7"/>

      <!-- utility pouches, strapped to the base -->
      <rect x="30" y="112" width="20" height="22" rx="5" fill="#2f8580"/>
      <rect x="110" y="112" width="20" height="22" rx="5" fill="#2f8580"/>

      <!-- bright core -->
      <circle cx="80" cy="88" r="15" fill="#43b8b0"/>

      <!-- moss settled on the crown -->
      <path d="M62 30 q10 -10 20 -2 q8 -8 18 2 z" fill="#6f9a52"/>
    </g>

    <circle cx="80" cy="88" r="7" fill="#c8f2ee"/>
    <!-- eyes on the crown stone -->
    <circle cx="71" cy="48" r="4.5" fill="#07211f"/>
    <circle cx="89" cy="48" r="4.5" fill="#07211f"/>
    <circle cx="72.5" cy="46.5" r="1.6" fill="#c9d9d7"/>
    <circle cx="90.5" cy="46.5" r="1.6" fill="#c9d9d7"/>
    <path d="M74 58 q6 4 12 0" fill="none" stroke="#07211f" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>
