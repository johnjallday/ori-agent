<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160" role="img" aria-label="Automation Specialist: a narrow bird-profiled construct with mechanical joints, a wind-up key and a lens eye">
  <!-- Automation Specialist. Hand-authored; see docs/CHARACTER_ASSET_PROVENANCE.md#automation-specialist
       Transparent artboard: the card, halo, ground strip, and clip frame are the host's to draw. -->
  <g stroke="#241505" stroke-width="4" stroke-linejoin="round" stroke-linecap="round">
    <!-- thin mechanical legs -->
    <path d="M70 120 v20 l-8 6" fill="none"/>
    <path d="M90 120 v20 l8 6" fill="none"/>

    <!-- wind-up key -->
    <circle cx="112" cy="76" r="13" fill="none" stroke-width="5"/>
    <path d="M99 76 h-12" stroke-width="5"/>

    <!-- narrow body -->
    <path d="M62 116 q-4 -44 18 -44 q22 0 18 44 z" fill="#e7d9bd"/>
    <!-- joint bands -->
    <path d="M66 94 h28 M65 104 h30" stroke-width="3"/>

    <!-- wing plate -->
    <path d="M64 82 q16 -6 20 10 q-10 10 -20 4 z" fill="#a66d23"/>

    <!-- head, narrow bird profile -->
    <circle cx="80" cy="52" r="20" fill="#e7d9bd"/>
    <!-- beak -->
    <path d="M98 48 l20 6 l-20 6 z" fill="#a66d23"/>
    <!-- crest pin -->
    <path d="M80 32 v-14" stroke-width="5"/>
    <circle cx="80" cy="16" r="5" fill="#a66d23"/>
  </g>

  <!-- status lens: an aperture, deliberately not a state indicator -->
  <circle cx="76" cy="50" r="9" fill="#f9efdd" stroke="#241505" stroke-width="4"/>
  <circle cx="76" cy="50" r="4.5" fill="#241505"/>
  <circle cx="77.5" cy="48.5" r="1.5" fill="#f9efdd"/>
</svg>
