<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" role="img" aria-label="Project Coordinator">
  <!-- Project Coordinator idle: checks a list, taps the next item. Decorative only (FR-72).
       Transparent artboard. The disc that used to sit behind this sprite was also
       cropping it: the ears ran to y=-1 and the tail to x=45 before the flick even
       started. Both are refitted inside the 2-unit safe perimeter, with the tail's
       +7deg extreme accounted for; the flick itself is unchanged. -->
  <style>
    .piko-tail { transform-origin: 32px 38px; animation: piko-flick 3s ease-in-out infinite; }
    @keyframes piko-flick { 0%,60%,100% { transform: rotate(0deg); } 75% { transform: rotate(7deg); } }
    @media (prefers-reduced-motion: reduce) { .piko-tail { animation: none; } }
  </style>
  <g stroke="#2a1006" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round">
    <path class="piko-tail" d="M32 39 q11 -3 9 -14 q-2 -11 -11 -8 q6 3 5 10 q-1 7 -5 9 z" fill="#b75d34"/>
    <!-- body; its base is the y=43 ground line -->
    <path d="M11 43 q-1-14 13-15 q14 -1 13 15 z" fill="#fbf0e2"/>
    <circle cx="23" cy="20" r="11" fill="#fbf0e2"/>
    <path d="M15 12 q-2 -7 2 -7 q4 0 3 6" fill="#fbf0e2"/>
    <path d="M31 12 q2 -7 -2 -7 q-4 0 -3 6" fill="#fbf0e2"/>
  </g>
  <circle cx="18" cy="19" r="2.2" fill="#2a1006"/>
  <circle cx="28" cy="19" r="2.2" fill="#2a1006"/>
  <path d="M20 26 q3 3 6 0" fill="none" stroke="#2a1006" stroke-width="2" stroke-linecap="round"/>
</svg>
