<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" role="img" aria-label="Sable">
  <!-- Sable idle: straightens notes, then a slow blink. Decorative only (FR-72). -->
  <style>
    .sable-lid { transform-origin: 24px 20px; animation: sable-blink 4.6s steps(1) infinite; }
    @keyframes sable-blink { 0%,94%,100% { transform: scaleY(0); } 96%,99% { transform: scaleY(1); } }
    @media (prefers-reduced-motion: reduce) { .sable-lid { animation: none; transform: scaleY(0); } }
  </style>
  <circle cx="24" cy="24" r="24" fill="#dfe8d8"/>
  <g stroke="#0f1a0e" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round">
    <path d="M9 44 q0-16 15-16 q15 0 15 16 z" fill="#f3f0e2"/>
    <path d="M8 32 q3-11 16-11 q13 0 16 11 q-7 4 -16 4 q-9 0 -16 -4 z" fill="#4f744a"/>
    <path d="M11 17 q0-10 13-10 q13 0 13 10 l0 3 q0 8 -13 8 q-13 0 -13 -8 z" fill="#f3f0e2"/>
    <path d="M11 16 q13-6 26 0" fill="none" stroke-width="3"/>
  </g>
  <g stroke="#0f1a0e" stroke-width="1.8" fill="none">
    <circle cx="19" cy="21" r="4.2"/>
    <circle cx="30" cy="21" r="4.2"/>
  </g>
  <circle cx="19" cy="21" r="1.7" fill="#0f1a0e"/>
  <circle cx="30" cy="21" r="1.7" fill="#0f1a0e"/>
  <g class="sable-lid">
    <rect x="14" y="17" width="10" height="5" fill="#f3f0e2"/>
    <rect x="25" y="17" width="10" height="5" fill="#f3f0e2"/>
  </g>
</svg>
