<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" role="img" aria-label="Ori the duck guide">
  <!--
    Ori launcher sprite. Hand-authored; see
    docs/CHARACTER_ASSET_PROVENANCE.md#ori-guide.
    Deliberately coarser than the portrait: at 48px only the bill, crown tuft,
    and head silhouette survive, so those carry the recognition.

    Transparent artboard — the disc this sprite used to sit inside belongs to the
    host. Losing the disc also lost the crop that was hiding two clipped edges,
    so the duck is fitted to the 2px safe perimeter with the head tilt's own
    extremes accounted for: the bill reaches furthest right at the +3deg keyframe,
    not at rest, and the tuft reaches highest there too.

    Idle motion is decorative and never encodes state (FR-72). The renderer
    swaps in static.svg under reduced motion; the media query below is a second
    line of defence wherever this file is embedded directly.
  -->
  <style>
    .ori-head { transform-origin: 23px 30px; animation: ori-tilt 3.2s ease-in-out infinite; }
    @keyframes ori-tilt {
      0%, 62%, 100% { transform: rotate(0deg); }
      74% { transform: rotate(-6deg); }
      86% { transform: rotate(3deg); }
    }
    @media (prefers-reduced-motion: reduce) { .ori-head { animation: none; } }
  </style>
  <g stroke="#3b2a12" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round">
    <!-- body; its base is the y=43 ground line -->
    <ellipse cx="22" cy="34" rx="12" ry="9" fill="#fbf3e4"/>
    <g class="ori-head">
      <!-- head -->
      <circle cx="23" cy="20" r="10" fill="#fbf3e4"/>
      <!-- broad bill -->
      <path d="M31 17 h8 q3 0 3 3 q0 3 -3 3 h-8 z" fill="#bd7c24"/>
      <!-- crown tuft -->
      <path d="M16 12 l2 -6 l4 4 l3 -5 l3 7 z" fill="#bd7c24"/>
    </g>
  </g>
  <circle cx="26.5" cy="18.2" r="1.9" fill="#3b2a12"/>
  <circle cx="27.2" cy="17.5" r="0.75" fill="#fbf3e4"/>
</svg>
