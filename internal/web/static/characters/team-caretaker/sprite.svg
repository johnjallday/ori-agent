<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" role="img" aria-label="Team Caretaker">
  <!-- Team Caretaker idle: waters the sprout, then settles into an easy breath. Decorative only (FR-72).
       Transparent artboard. The disc was cropping the sprout's leaf tips, so the
       sprout is lowered onto the head and the body base moved to the shared
       y=43 ground line; the sway itself is unchanged. -->
  <style>
    .moss-sprout { transform-origin: 24px 12px; animation: moss-sway 4.2s ease-in-out infinite; }
    @keyframes moss-sway { 0%,100% { transform: rotate(-2.5deg); } 50% { transform: rotate(2.5deg); } }
    @media (prefers-reduced-motion: reduce) { .moss-sprout { animation: none; transform: rotate(0deg); } }
  </style>
  <g stroke="#171e07" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round">
    <!-- body; its base is the y=43 ground line -->
    <rect x="11" y="26" width="26" height="17" rx="8" fill="#f4f1df"/>
    <path d="M13 32 q11 -5 22 0 l0 7 q-11 4 -22 0 z" fill="#7d8f3c"/>
    <rect x="14" y="11" width="20" height="16" rx="7" fill="#f4f1df"/>
    <g class="moss-sprout">
      <path d="M24 12 v-4" fill="none" stroke-width="2.4"/>
      <path d="M24 11 q-6 -1 -5 -5 q5 -1 5 5 z" fill="#7fae4a"/>
      <path d="M24 12 q6 -1 5 -5 q-5 -1 -5 5 z" fill="#5f8f33"/>
    </g>
  </g>
  <path d="M18 18 q2 -2 4 0" fill="none" stroke="#171e07" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M26 18 q2 -2 4 0" fill="none" stroke="#171e07" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M21 23 q3 2.5 6 0" fill="none" stroke="#171e07" stroke-width="2" stroke-linecap="round"/>
</svg>
