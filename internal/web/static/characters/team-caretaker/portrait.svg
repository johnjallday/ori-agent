<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160" role="img" aria-label="Team Caretaker: a soft rectangular resident with a messenger pouch and a living sprout">
  <!-- Team Caretaker. Hand-authored; see docs/CHARACTER_ASSET_PROVENANCE.md#team-caretaker -->
  <defs><clipPath id="moss-frame"><rect width="160" height="160" rx="16"/></clipPath></defs>
  <g clip-path="url(#moss-frame)">
    <rect width="160" height="160" fill="#e6e9d0"/>
    <circle cx="80" cy="74" r="54" fill="#f2f4e2"/>
    <rect x="0" y="144" width="160" height="16" fill="#cbd0ac"/>

    <g stroke="#171e07" stroke-width="4" stroke-linejoin="round" stroke-linecap="round">
      <rect x="52" y="128" width="22" height="18" rx="6" fill="#4f5c1c"/>
      <rect x="86" y="128" width="22" height="18" rx="6" fill="#4f5c1c"/>

      <!-- soft rectangular body, relaxed shoulders -->
      <rect x="44" y="70" width="72" height="62" rx="22" fill="#f4f1df"/>

      <!-- shell/back plate -->
      <path d="M50 92 q30 -14 60 0 l0 20 q-30 12 -60 0 z" fill="#7d8f3c"/>

      <!-- messenger pouch -->
      <path d="M44 96 q-14 8 -8 24 q4 12 18 8" fill="none" stroke-width="6"/>
      <rect x="98" y="108" width="26" height="22" rx="5" fill="#5f6f27"/>

      <!-- head, low and wide -->
      <rect x="56" y="34" width="48" height="40" rx="18" fill="#f4f1df"/>

      <!-- living sprout -->
      <path d="M80 34 v-14" fill="none" stroke-width="4"/>
      <path d="M80 24 q-14 -2 -12 -12 q12 -2 12 12 z" fill="#7fae4a"/>
      <path d="M80 28 q14 -2 12 -12 q-12 -2 -12 12 z" fill="#5f8f33"/>
    </g>

    <path d="M66 54 q4 -4 8 0" fill="none" stroke="#171e07" stroke-width="4" stroke-linecap="round"/>
    <path d="M86 54 q4 -4 8 0" fill="none" stroke="#171e07" stroke-width="4" stroke-linecap="round"/>
    <path d="M74 64 q6 5 12 0" fill="none" stroke="#171e07" stroke-width="3.5" stroke-linecap="round"/>
  </g>
</svg>
