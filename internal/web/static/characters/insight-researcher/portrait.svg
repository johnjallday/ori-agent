<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160" role="img" aria-label="Insight Researcher: a light-framed familiar with tall ears and folded crescent wings holding a field notebook">
  <!-- Insight Researcher. Hand-authored; see docs/CHARACTER_ASSET_PROVENANCE.md#insight-researcher
       Transparent artboard: the card, halo, ground strip, and clip frame are the host's to draw.
       The frame was also cropping the ear tips and antenna curls, so both are
       brought down inside the 6-unit safe perimeter. -->
  <g stroke="#1c1220" stroke-width="4" stroke-linejoin="round" stroke-linecap="round">
    <path d="M66 130 v10 l-8 6 h18 z" fill="#5f4468"/>
    <path d="M94 130 v10 l-8 6 h18 z" fill="#5f4468"/>

    <!-- folded crescent wings, scalloped so they never read as hair -->
    <path d="M54 80 q-26 8 -24 34 q10 -8 14 2 q6 -10 12 0 q-6 -18 -2 -36 z" fill="#83618a"/>
    <path d="M106 80 q26 8 24 34 q-10 -8 -14 2 q-6 -10 -12 0 q6 -18 2 -36 z" fill="#9a77a1"/>

    <!-- light frame body, tinted lavender so the silhouette is not read as a
         second cream resident at a glance -->
    <path d="M58 132 q-2-40 22-42 q24 -2 22 42 z" fill="#e6dcec"/>

    <!-- head -->
    <circle cx="80" cy="58" r="24" fill="#e6dcec"/>
    <!-- tall, narrow, splayed ears with antenna curls -->
    <path d="M68 40 q-12 -24 -4 -28 q9 -2 12 24" fill="#e6dcec"/>
    <path d="M92 40 q12 -24 4 -28 q-9 -2 -12 24" fill="#e6dcec"/>
    <path d="M63 16 q-6 -4 -2 -6" fill="none" stroke-width="3.5"/>
    <path d="M97 16 q6 -4 2 -6" fill="none" stroke-width="3.5"/>

    <!-- field notebook with specimen tabs -->
    <rect x="88" y="104" width="30" height="26" rx="3" fill="#fdfaf2"/>
  </g>

  <rect x="114" y="108" width="6" height="5" fill="#7fae4a"/>
  <rect x="114" y="116" width="6" height="5" fill="#d9a83c"/>
  <path d="M94 112 h16 M94 120 h12" stroke="#c2b3c8" stroke-width="2.5" stroke-linecap="round"/>

  <!-- inner-ear tint -->
  <path d="M70 38 q-6 -18 -3 -22 q4 -1 5 17" fill="#c8abd1"/>
  <path d="M90 38 q6 -18 3 -22 q-4 -1 -5 17" fill="#c8abd1"/>

  <circle cx="71" cy="56" r="4.5" fill="#1c1220"/>
  <circle cx="89" cy="56" r="4.5" fill="#1c1220"/>
  <circle cx="72.5" cy="54.5" r="1.6" fill="#f7f2f9"/>
  <circle cx="90.5" cy="54.5" r="1.6" fill="#f7f2f9"/>
  <!-- drifting mote it follows -->
  <circle cx="118" cy="52" r="4" fill="#c9a4d1"/>
  <circle cx="128" cy="42" r="2.5" fill="#dcc3e2"/>
</svg>
