<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" role="img" aria-label="Insight Researcher">
  <!-- Insight Researcher idle: wings shimmer as it follows a drifting mote. Decorative only (FR-72).
       Transparent artboard. The disc was cropping heavily here — the ears ran to
       y=-5 and both wings overhung the artboard — so ears, wings, and body are
       refitted inside the 2-unit safe perimeter. The shimmer and drift are
       unchanged. -->
  <style>
    .luma-mote { animation: luma-drift 5s ease-in-out infinite; }
    .luma-wing { animation: luma-shimmer 5s ease-in-out infinite; }
    @keyframes luma-drift { 0%,100% { transform: translate(0,0); } 50% { transform: translate(-2px,-3px); } }
    @keyframes luma-shimmer { 0%,100% { opacity: 1; } 50% { opacity: .78; } }
    @media (prefers-reduced-motion: reduce) {
      .luma-mote, .luma-wing { animation: none; opacity: 1; transform: none; }
    }
  </style>
  <g stroke="#1c1220" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round">
    <g class="luma-wing">
      <path d="M15 26 q-10 4 -9 14 q4 -3 6 1 q3 -4 5 0 q-3 -8 -2 -15 z" fill="#83618a"/>
      <path d="M33 26 q10 4 9 14 q-4 -3 -6 1 q-3 -4 -5 0 q3 -8 2 -15 z" fill="#9a77a1"/>
    </g>
    <!-- body; its base is the y=43 ground line -->
    <path d="M14 43 q-1-15 10-16 q11 -1 10 16 z" fill="#e6dcec"/>
    <circle cx="24" cy="21" r="10" fill="#e6dcec"/>
    <path d="M18 12 q-4 -7 -1 -7 q3 0 4 5" fill="#e6dcec"/>
    <path d="M30 12 q4 -7 1 -7 q-3 0 -4 5" fill="#e6dcec"/>
  </g>
  <circle cx="20" cy="20" r="2.2" fill="#1c1220"/>
  <circle cx="28" cy="20" r="2.2" fill="#1c1220"/>
  <circle class="luma-mote" cx="41" cy="14" r="2.4" fill="#c9a4d1"/>
</svg>
