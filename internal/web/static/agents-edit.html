<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Agent - Ori Agent</title>
    <script>
        // Apply theme immediately to prevent flash
        (function() {
            const savedTheme = localStorage.getItem('ori-theme') || 'light';
            document.documentElement.setAttribute('data-bs-theme', savedTheme);
            if (savedTheme === 'dark') {
                document.documentElement.classList.add('dark-mode');
            }
        })();
    </script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/common.css">
    <style>
        body {
            margin: 0;
            padding: 0;
            background: var(--bg-secondary);
            color: var(--text-primary);
            min-height: 100vh;
        }

        .simple-navbar {
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
            padding: 16px 20px;
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .navbar-brand {
            font-size: 20px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .nav-links {
            display: flex;
            gap: 16px;
            margin-left: auto;
        }

        .nav-link {
            padding: 8px 16px;
            text-decoration: none;
            color: var(--text-primary);
            border-radius: 6px;
            transition: background 0.2s;
        }

        .nav-link:hover {
            background: var(--bg-tertiary);
        }

        .nav-link.active {
            background: var(--primary-color);
            color: white;
        }

        .edit-container {
            max-width: 960px;
            margin: 0 auto;
            padding: 20px;
        }

        .page-header {
            margin-bottom: 24px;
        }

        .page-header h1 {
            font-size: 28px;
            margin-bottom: 8px;
        }

        .page-header p {
            color: var(--text-muted);
            font-size: 14px;
            margin: 0;
        }

        .back-button {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            text-decoration: none;
            color: var(--text-primary);
            margin-bottom: 16px;
            transition: all 0.2s;
        }

        .back-button:hover {
            background: var(--bg-tertiary);
        }

        .form-card {
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 20px;
        }

        .form-section-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border-color);
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-label {
            display: block;
            font-weight: 500;
            margin-bottom: 8px;
            color: var(--text-primary);
        }

        .form-input,
        .form-textarea {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 14px;
            font-family: inherit;
            background: var(--bg-primary);
            color: var(--text-primary);
            transition: border-color 0.2s;
        }

        .form-input:focus,
        .form-textarea:focus {
            outline: none;
            border-color: var(--primary-color);
        }

        .form-textarea {
            resize: vertical;
            min-height: 120px;
        }

        .readonly-field {
            padding: 10px 14px;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 14px;
            color: var(--text-primary);
        }

        .form-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 16px;
        }

        .tags-input-container {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            padding: 8px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            min-height: 44px;
            cursor: text;
        }

        .tag-input {
            border: none;
            outline: none;
            background: transparent;
            min-width: 120px;
            font-size: 14px;
            color: var(--text-primary);
        }

        .tag-item {
            background: var(--bg-tertiary);
            color: var(--text-primary);
            padding: 6px 10px;
            border-radius: 6px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
        }

        .tag-remove {
            cursor: pointer;
            opacity: 0.7;
        }

        .tag-remove:hover {
            opacity: 1;
        }

        .color-picker-group {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .color-preview {
            width: 40px;
            height: 40px;
            border-radius: 8px;
            border: 2px solid var(--border-color);
        }

        .form-actions {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            align-items: center;
        }

        .btn {
            padding: 10px 18px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary {
            background: var(--primary-color, #007bff);
            color: white;
        }

        .btn-secondary {
            background: var(--bg-secondary);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
        }

        .btn:hover {
            opacity: 0.9;
        }

        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .loading-spinner {
            background: white;
            padding: 24px 28px;
            border-radius: 12px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.2);
            text-align: center;
        }

        .dark-mode .loading-spinner,
        [data-bs-theme="dark"] .loading-spinner {
            background: #1f2937;
            color: white;
        }

        .toggle-switch {
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }

        .favorite-checkbox {
            width: 20px;
            height: 20px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="simple-navbar">
        <a href="/agents-dashboard" class="navbar-brand">Ori Agent</a>
        <div class="nav-links">
            <a href="/agents-dashboard" class="nav-link">Agents</a>
            <a href="/studios.html" class="nav-link">Studios</a>
            <a href="/workflows.html" class="nav-link">Workflows</a>
        </div>
    </div>

    <div class="edit-container">
        <a id="backLink" class="back-button" href="/agents-dashboard">← Back</a>

        <div class="page-header">
            <h1>Edit Agent</h1>
            <p>Update core settings and metadata for this agent.</p>
        </div>

        <div id="errorMessage" class="alert alert-danger" style="display: none;"></div>
        <div id="successMessage" class="alert alert-success" style="display: none;">Agent updated successfully.</div>

        <div class="form-card">
            <h2 class="form-section-title">Agent Overview</h2>
            <div class="form-row">
                <div class="form-group">
                    <label class="form-label" for="agentNameInput">Name</label>
                    <input type="text" id="agentNameInput" class="form-input" placeholder="Agent name">
                </div>
                <div class="form-group">
                    <label class="form-label" for="agentType">Type</label>
                    <select id="agentType" class="form-select">
                        <option value="tool-calling">Tool Calling</option>
                        <option value="conversational">Conversational</option>
                        <option value="task-oriented">Task Oriented</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label" for="agentRole">Role</label>
                    <select id="agentRole" class="form-select">
                        <option value="general">General</option>
                        <option value="coding">Coding</option>
                        <option value="research">Research</option>
                        <option value="creative">Creative</option>
                        <option value="analysis">Analysis</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label" for="agentModel">Model</label>
                    <input type="text" id="agentModel" class="form-input" placeholder="e.g., gpt-4o" list="modelOptionsList">
                    <datalist id="modelOptionsList"></datalist>
                </div>
            </div>
        </div>

        <div class="form-card">
            <h2 class="form-section-title">Metadata</h2>
            <div class="form-group">
                <label class="form-label" for="agentDescription">Description</label>
                <textarea id="agentDescription" class="form-textarea" placeholder="Describe the agent's purpose or behavior"></textarea>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label class="form-label">Avatar Color</label>
                    <div class="color-picker-group">
                        <div id="colorPreview" class="color-preview" style="background: #4f46e5;"></div>
                        <input type="color" id="avatarColor" class="form-input" value="#4f46e5" onchange="updateColorPreview(this.value)">
                    </div>
                    <div class="form-help">Pick a color for the agent avatar.</div>
                </div>
                <div class="form-group">
                    <label class="form-label">Favorite</label>
                    <div class="toggle-switch">
                        <input type="checkbox" id="favoriteToggle" class="favorite-checkbox">
                        <span>Mark as favorite</span>
                    </div>
                </div>
            </div>

            <div class="form-group">
                <label class="form-label" for="tagsInput">Tags</label>
                <div id="tagsContainer" class="tags-input-container" onclick="document.getElementById('tagsInput').focus()">
                    <input type="text" id="tagsInput" class="tag-input" placeholder="Add tags...">
                </div>
                <div class="form-help">Press Enter to add tags (e.g., "coding", "creative", "research").</div>
            </div>
        </div>

        <div class="form-card">
            <div class="form-actions">
                <button type="button" class="btn btn-secondary" id="cancelBtn">Cancel</button>
                <button type="button" class="btn btn-primary" id="saveBtn">Save Changes</button>
            </div>
        </div>
    </div>

    <div id="loadingOverlay" class="loading-overlay">
        <div class="loading-spinner">
            <p>Updating agent...</p>
        </div>
    </div>

    <script src="/js/agents-edit.js"></script>
</body>
</html>
