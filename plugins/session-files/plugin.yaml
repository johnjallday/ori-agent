name: session_files
version: 1.0.0
description: Provides tools for agents to manage files in session folders
author: Ori Agent
license: MIT
repository: https://github.com/johnjallday/ori-agent

tool_definition:
  description: |
    Manage files in the current session folder. Supports listing, reading, writing,
    modifying, and deleting files. Files can be text or binary (base64 encoded).
    Use this to work with files that users have uploaded or to create new files.
  parameters:
    - name: operation
      type: string
      required: true
      description: |
        Operation to perform:
        - list: List all files in the session
        - read: Read file contents
        - write: Create a new file
        - modify: Modify an existing file
        - delete: Delete a file
      enum:
        - list
        - read
        - write
        - modify
        - delete
    - name: session_id
      type: string
      required: true
      description: The session ID to operate on
    - name: file_id
      type: string
      required: false
      description: The ID of the file (required for read, modify, delete)
    - name: filename
      type: string
      required: false
      description: Name for the new file (required for write)
    - name: content
      type: string
      required: false
      description: File content (required for write and modify)
    - name: encoding
      type: string
      required: false
      description: "Content encoding: 'text' (default) or 'base64' for binary files"
      enum:
        - text
        - base64
    - name: mode
      type: string
      required: false
      description: "Modify mode: 'replace' (default), 'append', or 'prepend'"
      enum:
        - replace
        - append
        - prepend

settings:
  - name: server_url
    type: string
    default: "http://localhost:8765"
    description: URL of the Ori Agent server
    required: false
  - name: audit_logging
    type: boolean
    default: true
    description: Enable audit logging for all file operations
    required: false
  - name: max_read_size
    type: integer
    default: 10485760
    description: Maximum file size to read in bytes (default 10MB)
    required: false

requirements:
  min_ori_version: "1.0.0"
  api_version: "v1"

metadata:
  maintainers:
    - name: John Jallday
      email: john@example.com
  tags:
    - files
    - session
    - storage
