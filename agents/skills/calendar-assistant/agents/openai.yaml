interface:
  display_name: "Calendar Assistant"
  short_description: "Check calendars and schedules with read-only defaults"
  default_prompt: "Use $calendar-assistant to check my calendar or schedule and summarize what matters."

dependencies:
  tools:
    - type: "mcp"
      value: "google-calendar"
      description: "Google Calendar MCP server"

policy:
  allow_implicit_invocation: true
