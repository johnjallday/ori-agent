version: "2"

run:
  timeout: 5m

linters:
  default: standard
  enable:
    - unparam
  settings:
    staticcheck:
      checks:
        - all
        - "-ST1000"
        - "-ST1003"
        - "-ST1020"
        - "-ST1021"
        - "-ST1022"

issues:
  max-same-issues: 0
  max-issues-per-linter: 0
