<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Directory - Ori Agent</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #e4e4e7;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 20px;
        }

        /* Draggable title bar area */
        .title-bar {
            --wails-draggable: drag;
            height: 32px;
            margin: -20px -20px 10px -20px;
            padding: 0 20px;
            display: flex;
            align-items: center;
            cursor: grab;
        }

        h1 {
            font-size: 1.4rem;
            font-weight: 600;
            margin-bottom: 10px;
            color: #f59e0b;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        h1 svg {
            width: 24px;
            height: 24px;
            fill: #f59e0b;
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            font-size: 0.85rem;
            font-weight: 500;
            margin-bottom: 6px;
            color: #a1a1aa;
        }

        select, input[type="text"] {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #3f3f46;
            border-radius: 6px;
            background: #27272a;
            color: #e4e4e7;
            font-size: 0.9rem;
            outline: none;
            transition: border-color 0.2s;
        }

        select:focus, input[type="text"]:focus {
            border-color: #f59e0b;
        }

        select:disabled, input:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .drop-zone {
            border: 2px dashed #3f3f46;
            border-radius: 8px;
            padding: 24px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            background: #27272a;
            margin-bottom: 12px;
        }

        .drop-zone:hover {
            border-color: #f59e0b;
            background: #2d2d32;
        }

        .drop-zone.drag-over {
            border-color: #f59e0b;
            background: rgba(245, 158, 11, 0.1);
        }

        .drop-zone.has-path {
            border-color: #22c55e;
            background: rgba(34, 197, 94, 0.1);
        }

        .drop-zone-icon {
            font-size: 2rem;
            margin-bottom: 8px;
        }

        .drop-zone-text {
            font-size: 0.9rem;
            color: #a1a1aa;
        }

        .drop-zone-path {
            font-size: 0.8rem;
            color: #22c55e;
            margin-top: 8px;
            word-break: break-all;
            font-family: monospace;
        }

        .button-row {
            display: flex;
            gap: 10px;
            margin-top: auto;
            padding-top: 16px;
        }

        button {
            flex: 1;
            padding: 12px 16px;
            border: none;
            border-radius: 6px;
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-primary {
            background: #f59e0b;
            color: #000;
        }

        .btn-primary:hover:not(:disabled) {
            background: #d97706;
        }

        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-secondary {
            background: #3f3f46;
            color: #e4e4e7;
        }

        .btn-secondary:hover {
            background: #52525b;
        }

        .status {
            padding: 10px;
            border-radius: 6px;
            font-size: 0.85rem;
            margin-bottom: 16px;
            display: none;
        }

        .status.error {
            display: block;
            background: rgba(239, 68, 68, 0.2);
            border: 1px solid #ef4444;
            color: #fca5a5;
        }

        .status.success {
            display: block;
            background: rgba(34, 197, 94, 0.2);
            border: 1px solid #22c55e;
            color: #86efac;
        }

        .status.warning {
            display: block;
            background: rgba(245, 158, 11, 0.2);
            border: 1px solid #f59e0b;
            color: #fcd34d;
        }

        .loading {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid #3f3f46;
            border-top-color: #f59e0b;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 8px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="title-bar">
        <h1>
            <svg viewBox="0 0 24 24">
                <path d="M10,4H4C2.89,4 2,4.89 2,6V18A2,2 0 0,0 4,20H20A2,2 0 0,0 22,18V8C22,6.89 21.1,6 20,6H12L10,4Z"/>
            </svg>
            Add Directory Reference
        </h1>
    </div>

    <div id="status" class="status"></div>

    <div class="form-group">
        <label for="workspace">Workspace</label>
        <select id="workspace" disabled>
            <option value="">Loading workspaces...</option>
        </select>
    </div>

    <div class="form-group">
        <label>Directory</label>
        <div id="dropZone" class="drop-zone">
            <div class="drop-zone-icon">📁</div>
            <div class="drop-zone-text">Drag & drop a folder here, or click to browse</div>
            <div id="selectedPath" class="drop-zone-path" style="display: none;"></div>
        </div>
    </div>

    <div class="form-group">
        <label for="name">Display Name (optional)</label>
        <input type="text" id="name" placeholder="Uses folder name if empty">
    </div>

    <div class="button-row">
        <button class="btn-secondary" onclick="cancel()">Cancel</button>
        <button id="submitBtn" class="btn-primary" onclick="submit()" disabled>Add Directory</button>
    </div>

    <script>
        let selectedPath = '';
        let workspaces = [];

        // Initialize
        document.addEventListener('DOMContentLoaded', async () => {
            await checkServer();
            await loadWorkspaces();
            setupDropZone();
        });

        async function checkServer() {
            try {
                const connected = await window.go.main.App.CheckServerConnection();
                if (!connected) {
                    showStatus('warning', 'Ori Agent server not running. Please start the server first.');
                }
            } catch (e) {
                showStatus('error', 'Cannot connect to Ori Agent server');
            }
        }

        async function loadWorkspaces() {
            const select = document.getElementById('workspace');
            try {
                workspaces = await window.go.main.App.GetWorkspaces();

                if (workspaces.length === 0) {
                    select.innerHTML = '<option value="">No workspaces found</option>';
                    return;
                }

                select.innerHTML = '<option value="">Select a workspace...</option>';
                workspaces.forEach(ws => {
                    const option = document.createElement('option');
                    option.value = ws.id;
                    option.textContent = ws.name || ws.id;
                    select.appendChild(option);
                });
                select.disabled = false;
            } catch (e) {
                select.innerHTML = '<option value="">Error loading workspaces</option>';
                showStatus('error', 'Failed to load workspaces: ' + e.message);
            }
        }

        function setupDropZone() {
            const dropZone = document.getElementById('dropZone');

            // Click to browse
            dropZone.addEventListener('click', async () => {
                try {
                    const path = await window.go.main.App.OpenFolderDialog();
                    if (path) {
                        setSelectedPath(path);
                    }
                } catch (e) {
                    showStatus('error', 'Failed to open folder dialog: ' + e.message);
                }
            });

            // Drag and drop
            dropZone.addEventListener('dragover', (e) => {
                e.preventDefault();
                dropZone.classList.add('drag-over');
            });

            dropZone.addEventListener('dragleave', (e) => {
                e.preventDefault();
                dropZone.classList.remove('drag-over');
            });

            dropZone.addEventListener('drop', async (e) => {
                e.preventDefault();
                dropZone.classList.remove('drag-over');

                const files = e.dataTransfer.files;
                if (files.length > 0) {
                    // In Wails, we can get the path from the file
                    const file = files[0];
                    if (file.path) {
                        const result = await window.go.main.App.ValidatePath(file.path);
                        if (result.success) {
                            setSelectedPath(file.path);
                        } else {
                            showStatus('error', result.error);
                        }
                    } else {
                        showStatus('warning', 'Could not get folder path. Please use the Browse button.');
                    }
                }
            });
        }

        function setSelectedPath(path) {
            selectedPath = path;
            const dropZone = document.getElementById('dropZone');
            const pathDisplay = document.getElementById('selectedPath');

            dropZone.classList.add('has-path');
            dropZone.querySelector('.drop-zone-text').textContent = 'Folder selected:';
            pathDisplay.textContent = path;
            pathDisplay.style.display = 'block';

            // Auto-fill name with folder name if empty
            const nameInput = document.getElementById('name');
            if (!nameInput.value) {
                nameInput.placeholder = path.split('/').pop() || path.split('\\').pop();
            }

            updateSubmitButton();
            clearStatus();
        }

        function updateSubmitButton() {
            const btn = document.getElementById('submitBtn');
            const workspace = document.getElementById('workspace').value;
            btn.disabled = !selectedPath || !workspace;
        }

        document.getElementById('workspace').addEventListener('change', updateSubmitButton);

        async function submit() {
            const workspaceId = document.getElementById('workspace').value;
            const name = document.getElementById('name').value.trim();
            const btn = document.getElementById('submitBtn');

            btn.disabled = true;
            btn.innerHTML = '<span class="loading"></span>Adding...';

            try {
                const result = await window.go.main.App.AddDirectory(workspaceId, name, selectedPath);

                if (result.success) {
                    showStatus('success', result.message);
                    // Reset form for next use
                    setTimeout(() => {
                        resetForm();
                        window.go.main.App.HideWindow();
                    }, 1500);
                } else {
                    showStatus('error', result.error);
                    btn.disabled = false;
                    btn.textContent = 'Add Directory';
                }
            } catch (e) {
                showStatus('error', 'Failed to add directory: ' + e.message);
                btn.disabled = false;
                btn.textContent = 'Add Directory';
            }
        }

        function showStatus(type, message) {
            const status = document.getElementById('status');
            status.className = 'status ' + type;
            status.textContent = message;
        }

        function clearStatus() {
            const status = document.getElementById('status');
            status.className = 'status';
            status.textContent = '';
        }

        function resetForm() {
            selectedPath = '';
            document.getElementById('workspace').selectedIndex = 0;
            document.getElementById('name').value = '';
            document.getElementById('name').placeholder = 'Uses folder name if empty';

            const dropZone = document.getElementById('dropZone');
            const pathDisplay = document.getElementById('selectedPath');
            dropZone.classList.remove('has-path');
            dropZone.querySelector('.drop-zone-text').textContent = 'Drag & drop a folder here, or click to browse';
            pathDisplay.style.display = 'none';
            pathDisplay.textContent = '';

            clearStatus();
            updateSubmitButton();
        }

        function cancel() {
            resetForm();
            window.go.main.App.HideWindow();
        }

        function quit() {
            window.go.main.App.Quit();
        }
    </script>
</body>
</html>
