name: store
version: 1.0.0
description: File storage plugin for persisting agent outputs to the file system
license: MIT
repository: https://github.com/johnjallday/ori-agent

maintainers:
  - name: Ori Agent Team
    email: noreply@ori-agent.dev

platforms:
  - os: darwin
    architectures: [amd64, arm64]
  - os: linux
    architectures: [amd64, arm64]
  - os: windows
    architectures: [amd64]

requirements:
  min_ori_version: "0.0.1"
  api_version: "v1"
  dependencies: []

tool_definition:
  description: "Write data to a configured Store node on the canvas. Agents can dynamically specify filenames within the Store node's base directory."
  parameters:
    - name: store_node_id
      type: string
      description: "The canvas node ID of the Store node (e.g., 'store-node-1')"
      required: true
    - name: file_path
      type: string
      description: "Relative path within the Store node's base directory (e.g., 'daily-2025-01-15.json', '2025/jan/report.txt'). Must be relative - no absolute paths or '../' allowed."
      required: true
    - name: data
      type: string
      description: "The data to write. Format depends on the Store node's configuration (JSON string, plain text, markdown, or base64-encoded binary)"
      required: true
    - name: metadata
      type: object
      description: "Optional metadata about the write operation (e.g., timestamp, source_task_id)"
      required: false
      properties:
        timestamp:
          type: string
          description: "ISO 8601 timestamp of when the data was generated"
        source_task_id:
          type: string
          description: "ID of the task that generated this data"
