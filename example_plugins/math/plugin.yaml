name: math
version: 1.0.0
description: Perform basic math operations (add, subtract, multiply, divide)
tags: ["utility", "math"]
license: MIT
repository: https://github.com/johnjallday/ori-agent

maintainers:
  - name: Ori Agent Team
    email: noreply@ori-agent.dev

platforms:
  - os: darwin
    architectures: [amd64, arm64]
  - os: linux
    architectures: [amd64, arm64]
  - os: windows
    architectures: [amd64]

requirements:
  min_ori_version: "0.0.1"
  api_version: "v1"
  dependencies: []

tool_definition:
  description: "Perform basic math operations: add, subtract, multiply, divide"
  parameters:
    - name: operation
      type: string
      description: "Operation to perform: add, subtract, multiply, divide"
      required: true
    - name: a
      type: number
      description: "First operand"
      required: true
    - name: b
      type: number
      description: "Second operand"
      required: true
  operations:
    add:
      description: "Add two numbers together"
    subtract:
      description: "Subtract second number from first"
    multiply:
      description: "Multiply two numbers"
    divide:
      description: "Divide first number by second"
